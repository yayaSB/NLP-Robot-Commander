<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">Plan de l'appartement NLP Robot Commander</title>
  <desc id="desc">Salon et cuisine au nord, chambre et bureau au sud, reliés par un couloir central.</desc>
  <rect width="1000" height="800" fill="#eef2f5"/>
  <rect x="50" y="50" width="450" height="280" fill="#d6ab73"/>
  <rect x="500" y="50" width="450" height="280" fill="#8cc2e0"/>
  <rect x="50" y="470" width="450" height="280" fill="#b89ed1"/>
  <rect x="500" y="470" width="450" height="280" fill="#94c794"/>
  <rect x="50" y="330" width="900" height="140" fill="#b8b8ad"/>

  <g fill="#6f3f24" stroke="#3f2517" stroke-width="4">
    <rect x="85" y="135" width="65" height="150" rx="12"/>
    <rect x="230" y="165" width="105" height="58" rx="8"/>
  </g>
  <g fill="#e7e5dd" stroke="#6d6d68" stroke-width="4">
    <rect x="590" y="75" width="305" height="48"/>
    <rect x="670" y="165" width="115" height="62"/>
  </g>
  <g fill="#d3b9a6" stroke="#755d4f" stroke-width="4">
    <rect x="90" y="540" width="215" height="120" rx="10"/>
    <rect x="420" y="525" width="55" height="150"/>
  </g>
  <g fill="#7a5636" stroke="#49321f" stroke-width="4">
    <rect x="670" y="680" width="200" height="45"/>
    <rect x="870" y="525" width="48" height="150"/>
  </g>

  <g stroke="#171717" stroke-width="18" stroke-linecap="square" fill="none">
    <rect x="50" y="50" width="900" height="700"/>
    <path d="M500 50 V330 M500 470 V750"/>
    <path d="M50 330 H220 M330 330 H670 M780 330 H950"/>
    <path d="M50 470 H220 M330 470 H670 M780 470 H950"/>
  </g>

  <g font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#1e2933">
    <text x="275" y="105">SALON</text>
    <text x="725" y="105">CUISINE</text>
    <text x="275" y="520">CHAMBRE</text>
    <text x="725" y="520">BUREAU</text>
    <text x="500" y="415">COULOIR CENTRAL</text>
  </g>

  <g stroke="#0b57d0" stroke-width="5" fill="#ffffff">
    <circle cx="275" cy="274" r="13"/>
    <circle cx="725" cy="274" r="13"/>
    <circle cx="725" cy="526" r="13"/>
    <circle cx="140" cy="400" r="13" fill="#0b57d0"/>
  </g>
  <g font-family="sans-serif" font-size="19" font-weight="600" fill="#0b57d0">
    <text x="295" y="266">waypoint salon</text>
    <text x="745" y="266">waypoint cuisine</text>
    <text x="745" y="518">waypoint bureau</text>
    <text x="160" y="392">spawn + chargeur</text>
  </g>
